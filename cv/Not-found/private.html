<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Repository - Access Restricted</title>
  
  <!-- Font Awesome & Styles -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="not-found.css">
</head>
<body>

  <!-- MAIN CARD -->
  <main class="card">
    
    <!-- BADGE -->
    <div class="badge">
      <i class="fa-solid fa-lock"></i> Private Repository
    </div>

    <!-- TITLE & SUBTITLE -->
    <h1>Access Restricted</h1>
    <p class="subtitle">
      This code repository is private. You need authorized access or direct permission from the owner to view its contents, source code, and deployment branches.
    </p>

    <!-- ACTION BUTTONS -->
    <div class="actions">
      <button id="contactBtn" class="btn btn-primary">
        <i class="fa-solid fa-envelope"></i> Contact Owner
      </button>

      <a href="http://omolopasikali.vercel.app/" class="btn btn-outline">
        <i class="fa-solid fa-arrow-left"></i> Return Home
      </a>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
